[project]
name = "doppler1090"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyModeS>=3", "pyrtlsdr", "rich"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
doppler1090 = "doppler1090.cli:main"

[tool.setuptools]
packages = ["doppler1090"]
