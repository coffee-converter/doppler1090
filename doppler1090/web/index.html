<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>doppler1090</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The map is the scope: it fills the viewport. Chrome floats over it. -->
  <div id="map"></div>

  <!-- Left bar: status header, aircraft list, and (when one is selected) its
       measured-vs-predicted plot + stats. -->
  <aside id="rail">
    <header id="hud">
      <span class="brand"></span>
      <div class="statrow">
        <span class="stat" id="h-rx">--</span>
        <span class="stat" id="h-uptime">--<span class="u">up</span></span>
        <span class="stat" id="h-count">0<span class="u">ac</span></span>
        <span class="stat" id="h-rate">0<span class="u">brst/min</span></span>
      </div>
    </header>
    <div id="list"></div>
    <div id="detail">
      <div id="meta"></div>
      <div id="plotlegend">
        <span class="lg measured">measured</span>
        <span class="lg predicted">predicted</span>
      </div>
      <canvas id="plot"></canvas>
    </div>
  </aside>

  <!-- Bottom bar: nothing but the time-travel scrubber + transport. -->
  <section id="console">
    <div id="transport">
      <button id="toStart" title="jump to session start">⏮</button>
      <button id="playPause" title="play / pause (Space)">▶</button>
      <button id="speed" title="playback speed">1&times;</button>
      <div id="scrub">
        <canvas id="timeline"></canvas>
        <div id="playhead"></div>
      </div>
      <span class="badge past" id="h-mode" style="display:none">PAST</span>
      <span id="clock">--:--:--</span>
      <button id="live" class="on" title="return to live (L)">LIVE</button>
    </div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/aircraft-icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
